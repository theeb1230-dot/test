<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفيديوهات</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 0;
            padding-bottom: 56.25%; /* نسبة 16:9 */
            margin: 0 auto 20px auto;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .server-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }

        .server-btn {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .server-btn:hover, .server-btn.active {
            background-color: #e50914;
            border-color: #e50914;
        }
    </style>
</head>
<body>

    <h2>اختر السيرفر للمشاهدة</h2>

    <!-- حاوية المشغل -->
    <div class="player-container" id="playerWrapper">
        <!-- يتم إنشاء الـ iframe هنا تلقائياً -->
    </div>

    <!-- أزرار السيرفرات الخاصة بك -->
    <div class="server-list">
        <button class="server-btn active" onclick="changeServer(this, 'https://mp4.okhd.site/embed-vm6in0p12qt9.html')">Mp4</button>
        <button class="server-btn" onclick="changeServer(this, 'https://rty1.film77.xyz/embed-rdpchva9ubqp.html')">Rty1</button>
        <button class="server-btn" onclick="changeServer(this, 'https://vidoba.org/embed-ny3gm3g26e2k.html')">Vidoba</button>
        <button class="server-btn" onclick="changeServer(this, 'https://mp4plus.org/embed-lp9u5c9v8ku9.html')">Mp4plus</button>
        <button class="server-btn" onclick="changeServer(this, 'https://anafast.org/embed-mcxv0v42jxmv.html')">Anafast</button>
        <button class="server-btn" onclick="changeServer(this, 'https://vidspeed.org/embed-useub99jyope.html')">Vidspeed</button>
        <button class="server-btn" onclick="changeServer(this, 'https://abstream.to/e/va6zjkyufi9g')">Abstream</button>
        <button class="server-btn" onclick="changeServer(this, 'https://mixdrop.top/e/jd981z4mh788k44')">Mixdrop</button>
        <button class="server-btn" onclick="changeServer(this, 'https://dsvplay.com/e/p8grbth4p65w')">Dsvplay</button>
        <button class="server-btn" onclick="changeServer(this, 'https://voe.sx/e/6swgf1fzxy6h')">Voe</button>
    </div>

    <script>
        function changeServer(btnElement, url) {
            const wrapper = document.getElementById('playerWrapper');

            // 1. تفريغ الحاوية لإجبار السيرفر الخارجي على البدء من جديد
            wrapper.innerHTML = '';

            // 2. إنشاء عنصر iframe جديد بالكامل
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.setAttribute('allowfullscreen', 'true');
            iframe.setAttribute('webkitallowfullscreen', 'true');
            iframe.setAttribute('mozallowfullscreen', 'true');
            iframe.setAttribute('scrolling', 'no');
            iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
            
            // 3. إضافة الـ iframe للحاوية
            wrapper.appendChild(iframe);

            // 4. تحديث الشكل الفعال للأزرار
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // تشغيل السيرفر الأول (Mp4) تلقائياً عند فتح الصفحة
        window.onload = function() {
            const firstBtn = document.querySelector('.server-btn');
            if (firstBtn) {
                changeServer(firstBtn, 'https://mp4.okhd.site/embed-vm6in0p12qt9.html');
            }
        };
    </script>
</body>
</html>
